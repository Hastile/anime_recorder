name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # 서명 키: 저장소 시크릿(ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD)이 있으면 사용,
      # 없으면 처음 한 번 만들어 Actions 캐시에 보관해 다음 빌드에서도 같은 키를 쓴다.
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.android-signing
          key: android-signing-v1

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          DIR="$HOME/.android-signing"
          mkdir -p "$DIR"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$DIR/secret.keystore"
            STORE="$DIR/secret.keystore"; PASS="$KEYSTORE_PASSWORD"
            echo "저장소 시크릿의 서명 키 사용"
          else
            if [ ! -f "$DIR/release.keystore" ]; then
              openssl rand -hex 16 > "$DIR/pass"
              keytool -genkeypair -keystore "$DIR/release.keystore" -alias release -keyalg RSA -keysize 2048 \
                -validity 36500 -dname "CN=Anime Recorder" -storepass "$(cat "$DIR/pass")" -keypass "$(cat "$DIR/pass")"
              echo "새 서명 키를 만들었습니다 (Actions 캐시에 보관)"
            fi
            STORE="$DIR/release.keystore"; PASS="$(cat "$DIR/pass")"
          fi
          echo "::add-mask::$PASS"
          echo "SIGNING_STORE_FILE=$STORE" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleFullRelease assembleLiteRelease

      - name: Collect APKs
        run: |
          cp android/app/build/outputs/apk/full/release/app-full-release.apk AnimeRecorder.apk
          cp android/app/build/outputs/apk/lite/release/app-lite-release.apk AnimeRecorder-lite.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AnimeRecorder-apk
          path: |
            AnimeRecorder.apk
            AnimeRecorder-lite.apk

      # 폰에서 바로 받을 수 있게 Releases의 "android-latest"에 항상 최신 APK를 올린다
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=android-latest
          NOTES="브랜치 ${GITHUB_REF_NAME} · 커밋 ${GITHUB_SHA::7} · 빌드 #${GITHUB_RUN_NUMBER}

          - AnimeRecorder.apk: 브라우저 연동(플로팅 버튼) 포함. 폰에서 받으면 Play 프로텍트가 막으므로 PC에서 install_android_app.bat으로 설치하세요.
          - AnimeRecorder-lite.apk: 연동 제외(공유하기/리모컨/알림). 폰에서 바로 받아 설치할 수 있습니다.
          두 버전은 같은 앱이라 서로 덮어 설치됩니다."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" --prerelease --target "$GITHUB_SHA" --title "Android 앱 (최신 빌드)" --notes "$NOTES"
          fi
          gh release upload "$TAG" AnimeRecorder.apk AnimeRecorder-lite.apk --clobber

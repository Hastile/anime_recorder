<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111317">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Anime Recorder</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <span class="brand">Anime Recorder</span>
  <span id="conn" class="pill">연결 중…</span>
  <span id="disk" class="pill muted"></span>
</header>

<main>
  <!-- 녹화 -->
  <section id="tab-rec" class="tab active">
    <div class="preview">
      <img id="preview" alt="">
      <div id="preview-empty" class="preview-empty">미리보기 없음</div>
      <div id="rec-badge" class="rec-badge hidden"><span class="dot"></span><span id="timer">00:00</span></div>
      <div id="autostop" class="autostop hidden"></div>
    </div>

    <div id="idle-panel">
      <label class="field">
        <span>주소 (비우면 지금 화면 그대로 녹화)</span>
        <input id="url" type="url" inputmode="url" placeholder="https://…" list="recent" autocomplete="off">
        <datalist id="recent"></datalist>
      </label>
      <label class="field">
        <span>제목</span>
        <input id="title" placeholder="예: 진격의 거인 3화">
      </label>
      <div class="field">
        <span>자동 정지</span>
        <div class="chips" id="autostop-chips">
          <button class="chip on" data-min="">없음</button>
          <button class="chip" data-min="25">25분</button>
          <button class="chip" data-min="30">30분</button>
          <button class="chip" data-min="60">1시간</button>
          <button class="chip" data-min="custom">직접</button>
        </div>
      </div>
      <button id="btn-start" class="big rec">● 녹화 시작</button>
    </div>

    <div id="live-panel" class="hidden">
      <button id="btn-mark" class="big mark">★ 지금 표시</button>
      <div class="chips" id="quick-labels"></div>
      <div class="row">
        <button id="btn-range" class="mid">구간 시작</button>
        <button id="btn-pause" class="mid">⏸ 일시정지</button>
        <button id="btn-stop" class="mid danger">■ 정지</button>
      </div>
      <h3>표시한 장면 <span id="mark-count" class="muted"></span></h3>
      <ul id="live-markers" class="markers"></ul>
    </div>

    <details id="iso" class="card iso">
      <summary><b>녹화 격리 점검</b> <span id="iso-sum" class="muted"></span></summary>
      <p class="muted small-text">PC로 다른 작업을 해도 녹화본에 섞이지 않는지 확인합니다.</p>
      <ul id="iso-list"></ul>
    </details>

    <ul id="events" class="events"></ul>
  </section>

  <!-- 기록 -->
  <section id="tab-hist" class="tab">
    <ul id="sessions" class="cards"></ul>
  </section>

  <!-- 예약 -->
  <section id="tab-sched" class="tab">
    <ul id="jobs" class="cards"></ul>
    <form id="job-form" class="card">
      <h3>새 예약</h3>
      <label class="field"><span>이름</span><input name="name" required placeholder="예: 토요일 신작"></label>
      <label class="field"><span>주소</span><input name="url" type="url" placeholder="https://… (선택)"></label>
      <div class="row">
        <label class="field"><span>시작</span><input name="time" type="time" required></label>
        <label class="field"><span>길이(분)</span><input name="duration_min" type="number" min="1" value="30" required></label>
      </div>
      <div class="field">
        <span>반복 요일 (아무것도 안 고르면 매일)</span>
        <div class="chips" id="weekday-chips"></div>
      </div>
      <label class="field"><span>또는 한 번만 (날짜)</span><input name="date" type="date"></label>
      <button class="big">예약 추가</button>
    </form>
  </section>
</main>

<nav class="tabbar">
  <button data-tab="rec" class="on">● 녹화</button>
  <button data-tab="hist">기록</button>
  <button data-tab="sched">예약</button>
</nav>

<dialog id="token-dlg">
  <form method="dialog">
    <h3>PC 연결</h3>
    <p class="muted">PC 서버 창에 나온 <b>접속 토큰</b>을 입력하세요.</p>
    <input id="token-input" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="big" value="ok">연결</button>
  </form>
</dialog>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>

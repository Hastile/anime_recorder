<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111317">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Anime Recorder</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <span class="brand">Anime Recorder</span>
  <span id="conn" class="pill">연결 중…</span>
  <span id="disk" class="pill muted"></span>
</header>

<main>
  <!-- 녹화 -->
  <section id="tab-rec" class="tab active">
    <div class="preview">
      <img id="preview" alt="">
      <div id="preview-empty" class="preview-empty">PC 화면 미리보기</div>
      <div id="rec-badge" class="rec-badge hidden"><span class="dot"></span><span id="timer">00:00</span></div>
    </div>

    <div id="idle-panel">
      <div id="shared" class="shared hidden">
        <span class="muted">공유받은 페이지</span>
        <b id="shared-url"></b>
      </div>
      <label class="field">
        <span>주소 (폰 브라우저에서 <b>공유 → Anime Recorder</b> 하면 자동으로 채워져요)</span>
        <input id="url" type="url" inputmode="url" placeholder="https://… (비우면 PC 화면 그대로 녹화)" autocomplete="off">
      </label>
      <div class="row">
        <label class="field">
          <span>시작 위치 (예: 12:34)</span>
          <input id="start-at" placeholder="처음부터">
        </label>
        <label class="field grow2">
          <span>파일 이름</span>
          <input id="title" placeholder="비우면 페이지 제목">
        </label>
      </div>
      <label class="check"><input id="stop-on-end" type="checkbox" checked> 영상이 끝나면 자동으로 정지</label>
      <button id="btn-start" class="big rec">● PC에서 녹화 시작</button>
    </div>

    <div id="live-panel" class="hidden">
      <div class="nowplaying">
        <div id="np-title" class="np-title"></div>
        <div class="np-bar"><div id="np-fill"></div></div>
        <div class="np-time"><span id="np-time">--:--</span><span id="np-end" class="muted"></span></div>
      </div>
      <div class="row">
        <button id="btn-back" class="mid">« 10초</button>
        <button id="btn-pause" class="mid">⏸ 일시정지</button>
        <button id="btn-fwd" class="mid">10초 »</button>
      </div>
      <button id="btn-stop" class="big danger-bg">■ 정지하고 저장</button>
      <div class="row rename">
        <input id="live-title" placeholder="파일 이름">
        <button id="btn-live-rename" class="mid narrow">이름 저장</button>
      </div>
    </div>

    <details id="iso" class="card iso hidden">
      <summary><b>녹화 격리 점검</b> <span id="iso-sum" class="muted"></span></summary>
      <p class="muted small-text">PC로 다른 작업을 해도 녹화본에 섞이지 않는지 확인합니다.</p>
      <ul id="iso-list"></ul>
    </details>

    <ul id="events" class="events"></ul>
  </section>

  <!-- 녹화본 -->
  <section id="tab-list" class="tab">
    <ul id="recordings" class="cards"></ul>
  </section>
</main>

<nav class="tabbar">
  <button data-tab="rec" class="on">● 녹화</button>
  <button data-tab="list">녹화본</button>
</nav>

<dialog id="token-dlg">
  <form method="dialog">
    <h3>PC 연결</h3>
    <p class="muted">PC 서버 창에 나온 <b>접속 토큰</b>을 입력하세요.</p>
    <input id="token-input" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="big" value="ok">연결</button>
  </form>
</dialog>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>

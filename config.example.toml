# 이 파일을 config.toml로 복사해서 수정하세요. (start.bat이 처음 실행할 때 자동으로 복사합니다)

[server]
host = "0.0.0.0"
port = 8765
# 비워 두면 처음 실행할 때 자동으로 만들어 data/token.txt에 저장합니다.
token = ""
# 앱의 PC 목록에 보일 이름 (비우면 컴퓨터 이름)
name = ""
# 같은 와이파이에서 앱이 PC를 자동으로 찾게 함 (UDP 8766)
discovery = true

[obs]
# OBS > 도구 > WebSocket 서버 설정 에서 확인
host = "127.0.0.1"
port = 4455
password = ""
# 녹화용 브라우저 창을 자동으로 연결할 OBS 소스 이름 (OBS에 보이는 이름 그대로)
video_source = "녹화 창"        # 윈도우 캡처
audio_source = "녹화 창 소리"   # 응용 프로그램 오디오 캡처

[browser]
# 녹화에 쓸 브라우저. 비우면 크롬 → 엣지 순서로 자동 탐색.
# 평소 크롬을 쓴다면 녹화는 엣지로 하는 것이 가장 확실합니다 (OBS가 창을 헷갈릴 일이 없음).
# executable = "C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe"
executable = ""
window_size = [1920, 1080]
# 보조 모니터가 있다면 그쪽에 띄우세요. 예: [1920, 0]
window_position = []
# 영상을 창에 꽉 채우기 (사이트 메뉴/댓글 없이 영상만 녹화). 화면이 이상한 사이트는 false로.
fill_video = true
# 페이지에서 영상을 찾을 때까지 기다리는 최대 시간(초)
video_timeout = 20
# 창을 띄운 뒤 맨 뒤로 보내고, 작업하던 창으로 포커스를 돌려줍니다
send_to_back = true
# 녹화가 끝나면 녹화용 창 닫기 (다음 화 자동재생 방지)
close_on_stop = true
extra_args = []

[recording]
# 녹화가 끝나면 파일 이름을 제목으로 바꿈 (예: "진격의 거인 3화.mkv")
rename_to_title = true

[storage]
data_dir = "data"

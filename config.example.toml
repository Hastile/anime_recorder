# 이 파일을 config.toml로 복사해서 수정하세요.

[server]
host = "0.0.0.0"
port = 8765
# 비워 두면 처음 실행할 때 자동으로 만들어 data/token.txt에 저장합니다.
token = ""
# 앱의 PC 목록에 보일 이름 (비우면 컴퓨터 이름)
name = ""
# 같은 와이파이에서 앱이 PC를 자동으로 찾게 함 (UDP 8766)
discovery = true

[obs]
# OBS > 도구 > WebSocket 서버 설정 에서 확인
host = "127.0.0.1"
port = 4455
password = ""
# 녹화 전용 브라우저 창을 자동으로 연결할 OBS 소스 이름 (OBS에 보이는 이름 그대로)
video_source = "녹화 창"        # 윈도우 캡처
audio_source = "녹화 창 소리"   # 응용 프로그램 오디오 캡처

[browser]
# 녹화 전용 브라우저: 별도 프로필의 독립된 창으로 열어서 평소 쓰는 브라우저와 섞이지 않게 합니다.
isolated = true
# 비우면 크롬 → 엣지 순서로 자동 탐색.
# 평소 크롬을 쓴다면 녹화는 엣지로 하는 것이 가장 확실합니다 (실행 파일이 달라서 OBS가 헷갈릴 일이 없음).
# executable = "C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe"
executable = ""
# 주소창/탭 없는 창 (캡처 화면이 깔끔)
app_mode = true
window_size = [1920, 1080]
# 보조 모니터가 있다면 그쪽에 띄우세요. 예: [1920, 0]
window_position = []
# 창을 띄운 뒤 맨 뒤로 보내고, 작업하던 창으로 포커스를 돌려줍니다
send_to_back = true
# 녹화가 끝나면 녹화용 창 닫기 (다음 화 자동재생 방지)
close_on_stop = true
extra_args = []

# isolated = false 일 때만 사용. 비우면 기본 브라우저.
command = []
# 페이지를 연 뒤 녹화 시작까지 기다리는 시간(초)
wait_seconds = 5

[clips]
# ffmpeg.exe 경로 (PATH에 있으면 그대로)
ffmpeg = "ffmpeg"
# "지금 표시" 기준 앞/뒤 몇 초를 자를지
pre_seconds = 10
post_seconds = 5
# false: 무손실 고속 자르기(키프레임 단위)  /  true: 재인코딩(프레임 단위로 정확, 느림)
reencode = false
# 녹화가 끝나면 표시한 장면을 자동으로 잘라 저장
auto_export = true
# 비우면 <녹화 폴더>/clips
output_dir = ""
quick_labels = ["명장면", "웃김", "액션", "대사", "OP/ED"]

[storage]
data_dir = "data"
